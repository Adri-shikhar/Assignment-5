<!doctype html>
<html>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <link rel="icon" href="assets/github-logo.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Geist', sans-serif; }
    </style>
    <title>GitHub Issues Tracker</title>
</head>

<body class="min-h-screen bg-gray-100" style="font-family: 'Geist', sans-serif;">

    <!-- Navbar -->
    <nav class="bg-white border-b border-gray-200 px-6 py-3 flex items-center gap-4">
        <!-- Logo + Title -->
        <div class="flex items-center gap-2 flex-shrink-0">
            <div class="bg-gray-900 rounded-full w-8 h-8 flex items-center justify-center">
                <img src="assets/github-logo.png" alt="GitHub Logo" class="w-5 h-5 invert" />
            </div>
            <span class="font-bold text-gray-900 text-base">GitHub Issues Tracker</span>
        </div>

        <!-- Search -->
        <div class="flex-1 max-w-sm ml-auto">
            <div class="relative">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                    <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
                </svg>
                <input id="searchInput" type="text" placeholder="Search issues..." class="w-full pl-9 pr-3 py-1.5 border border-gray-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-400 bg-white" />
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto mt-8 px-4">

        <!-- Filter Tabs -->
        <div class="flex items-center gap-3 mb-4">
            <button id="btnAll" onclick="setActiveButton('btnAll')" class="btn btn-primary btn-sm">All</button>
            <button id="btnOpen" onclick="setActiveButton('btnOpen')" class="btn btn-outline btn-sm">Open</button>
            <button id="btnClosed" onclick="setActiveButton('btnClosed')" class="btn btn-outline btn-sm">Closed</button>
        </div>

        <!-- All Section -->
        <div id="all-section">
            <!-- Issues Summary Card -->
            <div class="bg-white rounded-xl border border-gray-200 px-5 py-4 flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <img src="assets/Aperture.png" alt="Issues Icon" class="w-9 h-9" />
                    <div>
                        <p id="issueCount" class="font-bold text-gray-900 text-base">50 Issues</p>
                        <p class="text-sm text-gray-500">Track and manage your project issues</p>
                    </div>
                </div>
                <div class="flex items-center gap-4 text-sm text-gray-600">
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-green-500 inline-block"></span> Open</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-purple-500 inline-block"></span> Closed</span>
                </div>
            </div>
            <!-- All Issues List -->
            <div id="issuesList" class="space-y-3 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-3 gap-4">
                <!-- Issues will be dynamically inserted here -->
               
            </div>
        </div>

        <!-- Open Section -->
        <div id="open-section" style="display: none;">
             <!-- Issues Summary Card -->
            <div class="bg-white rounded-xl border border-gray-200 px-5 py-4 flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <img src="assets/Aperture.png" alt="Issues Icon" class="w-9 h-9" />
                    <div>
                        <p id="issueCount" class="font-bold text-gray-900 text-base">50 Issues</p>
                        <p class="text-sm text-gray-500">Track and manage your project issues</p>
                    </div>
                </div>
                <div class="flex items-center gap-4 text-sm text-gray-600">
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-green-500 inline-block"></span> Open</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-purple-500 inline-block"></span> Closed</span>
                </div>
            </div>
            <div id="openIssuesList" class="space-y-3 grid grid-cols-1 md:grid-cols-3 lg:grid-cols-3 gap-4">
               
            </div>
        </div>

        <!-- Closed Section -->
        <div id="close-section" style="display: none;">
             <!-- Issues Summary Card -->
            <div class="bg-white rounded-xl border border-gray-200 px-5 py-4 flex items-center justify-between mb-4">
                <div class="flex items-center gap-3">
                    <img src="assets/Aperture.png" alt="Issues Icon" class="w-9 h-9" />
                    <div>
                        <p id="issueCount" class="font-bold text-gray-900 text-base">50 Issues</p>
                        <p class="text-sm text-gray-500">Track and manage your project issues</p>
                    </div>
                </div>
                <div class="flex items-center gap-4 text-sm text-gray-600">
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-green-500 inline-block"></span> Open</span>
                    <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-purple-500 inline-block"></span> Closed</span>
                </div>
            </div>
            <div id="closeIssuesList" class="space-y-3">
               
            </div>
        </div>

    </main>

    <script src="script/home.js"></script>

</body>

</html>
